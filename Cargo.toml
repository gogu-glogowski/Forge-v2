[workspace]
members = [
    "crates/forge-core",
    "crates/forge-hardware",
    "crates/forge-host",
    "crates/forge-doctor",
    "crates/forge-profiles",
    "crates/forge-domain",
    "crates/forge-storage",
    "crates/forge-images",
    "crates/forge-provisioning",
    "crates/forge-state",
    "crates/forge-libvirt",
    "crates/forge-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
