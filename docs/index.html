<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Soundtrack</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    main { width: min(920px, 92vw); text-align: center; }
    .prompt { color: #7d8590; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.7rem); }
    p { color: #8b949e; margin: 0 0 28px; }
    .player {
      overflow: hidden;
      border: 1px solid #30363d;
      border-radius: 14px;
      background: #010409;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    iframe { display: block; width: 100%; aspect-ratio: 16/9; border: 0; }
    .note { margin-top: 18px; font-size: .88rem; color: #6e7681; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <main>
    <div class="prompt">&gt; soundtrack --for=code</div>
    <h1>🎧 If you're reading my code, press play.</h1>
    <p>A little background music for the repository.</p>

    <div class="player">
      <iframe
        src="https://www.youtube.com/embed/S0Zv4IJviUs?list=RDS0Zv4IJviUs&autoplay=1&rel=0"
        title="Code soundtrack — YouTube"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="note">
      Playback is provided by YouTube. If your browser blocks autoplay, just press play.
      · <a href="https://www.youtube.com/watch?v=S0Zv4IJviUs&list=RDS0Zv4IJviUs&index=1">Open on YouTube</a>
    </div>
  </main>
</body>
</html>
